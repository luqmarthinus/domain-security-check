name: CI

# Run once per change. Pull requests test the branch merged into main; pushes
# run only on main, to test the real merge commit. Without the branch filter,
# every pull request ran twice (push + pull_request) and tag pushes re-tested
# a commit main had already tested.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels its older, now-pointless run. Runs on
# main are never cancelled, so every merge commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shellcheck:
    # ShellCheck comes preinstalled on GitHub's Ubuntu runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot
      # keeps the pins up to date. The comment shows the released version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck (all severity levels)
        run: |
          shellcheck --version
          shellcheck --shell=bash domain-security-check.sh

  live-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A normal run takes about a minute; the cap stops a hang (like the old
    # SPF loop) burning hours of runner time. Allows for 3 live attempts.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dig and whois (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils whois

      - name: Syntax with Apple's /bin/bash 3.2 and zsh (macOS)
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash -n domain-security-check.sh
          zsh -n domain-security-check.sh

      - name: Help and usage errors
        run: |
          bash domain-security-check.sh --help > /dev/null
          set +e
          bash domain-security-check.sh > /dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ]

      - name: Live check (example.com passes SPF/DMARC, expired.badssl.com fails)
        run: |
          printf '# test list\n  example.com  \n\n' > domains.txt
          # badssl.com times out from runners about 1 run in 10, and a re-run
          # minutes later passes. Retry only on exit 75 ("badssl.com
          # unreachable"); any wrong result fails at once, so retries can't
          # hide a real bug. See tests/check-live-report.py.
          for attempt in 1 2 3; do
            set +e
            bash domain-security-check.sh --json -f domains.txt -H expired.badssl.com > report.json
            code=$?
            python3 tests/check-live-report.py report.json "$code"
            result=$?
            set -e
            [ "$result" -eq 75 ] || exit "$result"
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::expired.badssl.com unreachable (attempt $attempt of 3); retrying in 30s"
              sleep 30
            fi
          done
          echo "::error::expired.badssl.com unreachable on all 3 attempts (network problem, not a script bug)"
          exit 1
