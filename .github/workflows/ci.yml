name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    # ShellCheck comes preinstalled on GitHub's Ubuntu runners.
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); Dependabot
      # keeps the pins up to date. The comment shows the released version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck (all severity levels)
        run: |
          shellcheck --version
          shellcheck --shell=bash domain-security-check.sh

  live-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dig and whois (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils whois

      - name: Syntax with Apple's /bin/bash 3.2 and zsh (macOS)
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash -n domain-security-check.sh
          zsh -n domain-security-check.sh

      - name: Help and usage errors
        run: |
          bash domain-security-check.sh --help > /dev/null
          set +e
          bash domain-security-check.sh > /dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ]

      - name: Live check (example.com passes SPF/DMARC, expired.badssl.com fails)
        run: |
          printf '# test list\n  example.com  \n\n' > domains.txt
          set +e
          bash domain-security-check.sh --json -f domains.txt -H expired.badssl.com > report.json
          code=$?
          set -e
          # Print every result before asserting anything, so a failed run
          # shows which check went wrong instead of only the exit code.
          EXIT_CODE=$code python3 -c '
          import json, os, sys
          code = int(os.environ["EXIT_CODE"])
          print(f"exit code: {code}")
          try:
              d = json.load(open("report.json"))
          except ValueError:
              print("::error::report.json is not valid JSON:")
              print(open("report.json").read())
              sys.exit(1)
          checks = {(c["domain"], c["id"]): c for c in d["checks"]}
          for (dom, cid), c in sorted(checks.items()):
              status, detail = c["status"], c["detail"]
              print(f"{status:<5} {dom:<14} {cid:<26} {detail}")

          errors = []
          bad = checks.get(("(extra hosts)", "https:expired.badssl.com"))
          if bad is None:
              errors.append("no result for expired.badssl.com")
          elif bad["status"] != "FAIL":
              # The script reports an unreachable host as WARN, not FAIL. Say so
              # clearly: it is a runner network problem, not a script bug.
              if "resolve" in bad["detail"] or "reachable" in bad["detail"]:
                  errors.append("expired.badssl.com was unreachable from this runner "
                                "(network problem, not a script bug): re-run the job")
              else:
                  errors.append("expired certificate not detected: " + bad["status"])
          for cid in ("spf", "dmarc"):
              status = checks.get(("example.com", cid), {}).get("status")
              if status != "PASS":
                  errors.append(f"example.com {cid}: expected PASS, got {status}")
          if code != 1:
              errors.append(f"exit code {code}, expected 1 (one FAIL)")

          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)
          print("live checks OK")
          '
